services:
  blocky:
    image: spx01/blocky
    container_name: blocky
    restart: always
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 4000:4000/tcp
    # networks:
    #   wireguard-blocky:
    #     ipv4_address: 192.168.1.2
    environment:
      - TZ=Europe/Brussels
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config.yml:/app/config.yml:ro
