id: ansible-apt
namespace: ansible
description: |
  Install available updates on a Debian-based system.
  This will also automatically remove old and unused packages.

inputs:
  - id: hosts
    displayName: "Hosts (comma separated)"
    type: STRING
    defaults: simlab

tasks:
  - id: ansible_task
    type: io.kestra.plugin.ansible.cli.AnsibleCLI
    ansibleConfig: |
      [defaults]
      interpreter_python = auto_silent
    inputFiles:
      inventory.ini: "{{ read('inventory.ini') }}"
      playbook.yml: |
        ---
        - name: Fully update Debian-based computers
          hosts: {{ inputs.hosts }}
          become: yes
          tasks:
            - name: Update and upgrade
              apt:
                update_cache: true
                #lock_timeout: 60
                upgrade: true
                autoclean: true
                autoremove: true
                purge: true
      id_rsa: "{{ read('id_rsa') }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      user: "1000"
    containerImage: cytopia/ansible:latest-tools
    commands:
      - ansible-playbook -i inventory.ini --key-file id_rsa playbook.yml
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"