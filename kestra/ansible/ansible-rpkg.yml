id: ansible-rpkg
namespace: ansible
description: |
  Compile the most used R packages.
  R is required to be on the system (use ansible-r flow).

inputs:
  - id: hosts
    displayName: "Hosts (comma separated)"
    type: STRING
    defaults: simlab

tasks:
  - id: ansible_task
    type: io.kestra.plugin.ansible.cli.AnsibleCLI
    ansibleConfig: |
      [defaults]
      interpreter_python = auto_silent
    namespaceFiles:
      enabled: true
      include:
        - inventory.ini
        - playbooks/rpkg.yml
        - id_rsa
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
      user: "1000"
    containerImage: cytopia/ansible:latest-tools
    commands:
      - ansible-playbook -i inventory.ini --key-file id_rsa --extra-vars "target={{ inputs.hosts }}" playbooks/rpkg.yml
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"