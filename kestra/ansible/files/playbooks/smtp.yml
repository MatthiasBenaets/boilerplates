---
- name: Set up smtp server and smart monitoring
  hosts: { { target } }
  become: yes
  #vars:
  #  email: email@gmail.com
  #  password: secret
  tasks:
    - name: Install helper packages
      apt:
        name:
          - smartmontools
          - opensmtpd
          - mailutils
        install_recommends: false
        update_cache: yes

    - name: Create mail directory
      file:
        path: /etc/mail
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Create /etc/smtpd.conf
      copy:
        content: |
          table aliases file:/etc/aliases
          table secrets file:/etc/mail/secrets

          listen on localhost

          action "local" maildir alias <aliases>
          action "relay" relay host smtp+tls://user@smtp.gmail.com:587 auth <secrets>

          match for local action "local"
          match from local for any action "relay"
        dest: /etc/smtpd.conf
        owner: root
        group: root
        mode: 0644

    - name: Create /etc/mail/secrets
      copy:
        content: "user {{ email }}:{{ password }}"
        dest: /etc/mail/secrets
        owner: root
        group: opensmtpd
        mode: 0640

    - name: Comment out /etc/smartd.conf or remove it
      copy:
        content: "{{ disk }} -d sat -o on -S on -H -l error -l selftest -f -n standby,15,q -s (L/../(01|16)/./03|S/../.././01|O/../.././(00|06|12|18)) -m matthias.benaets@uhasselt.be -M exec /usr/share/smartmontools/smartd-runner"
        dest: /etc/smartd.conf
        owner: root
        group: root
        mode: 0644

    - name: Restart and enable opensmtp
      systemd:
        name: opensmtpd
        state: restarted
        enabled: yes

    - name: Restart smartd
      systemd:
        name: smartd
        state: restarted
        enabled: yes
