---
- name: Configure NFS Server
  hosts: controller
  become: yes
  tasks:
    - name: Install nfs-kernel-server package
      ansible.builtin.apt:
        name:
          - nfs-kernel-server

    - name: Create nfs directory
      ansible.builtin.file:
        path: "{{ shared_dir }}"
        state: directory
        mode: "0755"

    - name: Configure exports file
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "{{ shared_dir }}  *(rw,sync,no_root_squash,no_subtree_check)"
        regexp: "^{{ shared_dir }}"
        state: present

    - name: Export share
      ansible.builtin.command: exportfs -a

    - name: Start and enable the nfs-kernel-server service
      ansible.builtin.service:
        name: nfs-kernel-server
        state: started
        enabled: yes
