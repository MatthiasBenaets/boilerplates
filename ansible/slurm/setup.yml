---
# Windows Active Directory
- import_playbook: playbooks/active-directory.yml
  when: auth_backend == "ad"
- import_playbook: playbooks/pam.yml
  when: auth_backend == "ad"

# OpenLDAP
- import_playbook: playbooks/ldap-controller.yml
  when: auth_backend == "ldap"
- import_playbook: playbooks/ldap-node.yml
  when: auth_backend == "ldap"

# Hosts Setup
- import_playbook: playbooks/etc-hosts.yml

# NFS Share & Environment Modules
- import_playbook: playbooks/nfs-controller.yml
- import_playbook: playbooks/lmod-controller.yml
- import_playbook: playbooks/nfs-node.yml
- import_playbook: playbooks/lmod-node.yml

# Slurm Setup
- import_playbook: playbooks/slurm-controller.yml
- import_playbook: playbooks/slurm-node.yml

# Slurm Accounting Database
- import_playbook: playbooks/slurmdb-node.yml
  when: slurm_acct == true
- import_playbook: playbooks/slurmdbd-controller.yml
  when: slurm_acct == true
